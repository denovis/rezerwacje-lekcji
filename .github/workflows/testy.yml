# Przy każdym PR i każdej zmianie w main: typy, testy na prawdziwym PostgreSQL,
# zgodność typów bazy z migracjami i zbudowanie aplikacji.
name: Testy

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sprawdzenie typów
        run: npm run typecheck
      - name: Testy na PostgreSQL
        run: npm test
      - name: Typy bazy zgodne z migracjami
        run: |
          npm run db:types -- --url postgres://postgres:postgres@localhost:5432/rezerwacje_test
          git diff --exit-code src/lib/db-types.ts
      - name: Budowanie aplikacji
        run: npm run build
