services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    # Sprawdzenie przez TCP: przy pierwszym starcie obraz uruchamia tymczasowy serwer
    # tylko na gnieździe lokalnym, więc `--wait` czeka na właściwy serwer.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
